<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sieve: verify what a pull request actually changes</title>
  <meta name="description" content="Sieve maps a repository's import graph, overlays a pull request's impact, and verifies what the PR claims against what it contains. Read-only, local open-weight model.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><g fill='%231d1d1f'><circle cx='3' cy='3' r='1.5'/><circle cx='8' cy='3' r='1.5'/><circle cx='13' cy='3' r='1.5'/><circle cx='3' cy='8' r='1.5'/><circle cx='8' cy='8' r='1.5'/><circle cx='13' cy='8' r='1.5'/><circle cx='8' cy='13' r='1.5'/></g></svg>">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="toolbar glass" role="banner">
    <a class="brand" href="/" aria-label="Sieve, home"><span class="mesh" aria-hidden="true"></span>sieve</a>
    <form id="form" class="field" role="search" autocomplete="off">
      <label for="target" class="sr">Pull request or repository</label>
      <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="target" spellcheck="false" placeholder="owner/repo#123 or owner/repo">
      <button type="submit" id="go" class="btn primary">Inspect</button>
    </form>
    <div class="status" id="status" aria-live="polite"></div>
  </header>

  <main id="main">
    <p class="banner" id="error" role="alert" hidden></p>
    <section id="home" class="view"></section>
    <section id="review" class="view" hidden></section>
    <section id="repo" class="view" hidden></section>
  </main>

  <footer class="foot">
    <span>Sieve · MIT licensed · <a href="https://github.com/ThatKJ/sieve">source</a></span>
    <span>Read-only on GitHub. Contributor code is never executed.</span>
  </footer>

  <script src="atlas.js"></script>
  <script src="app.js"></script>
</body>
</html>
